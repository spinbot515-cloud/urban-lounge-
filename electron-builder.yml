appId: app.urban-lounge.client
productName: Urban Lounge
copyright: Copyright 2026 Urban Lounge
directories:
  output: release
  buildResources: electron/build
files:
  - electron/**/*
  - client/dist/**/*
  - package.json
asar: true
npmRebuild: false
win:
  target:
    - nsis
  icon: electron/build/icon.png
nsis:
  # No spaces in the artifact name: every script that installs this file
  # would otherwise need to quote it.
  artifactName: Urban Lounge-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
  category: public.app-category.social-networking
  icon: electron/build/icon.png
  extendInfo:
    NSMicrophoneUsageDescription: Urban Lounge uses your microphone for voice calls.
    NSCameraUsageDescription: Urban Lounge uses your camera for video calls.
linux:
  target:
    - AppImage
  category: Network
  executableName: urban-lounge
  syncDesktopName: true
  synopsis: Urban Lounge community chat
  description: Urban Lounge is a realtime community platform with voice, video, friends, profiles, badges and an admin console.
  icon: electron/build/icon.png
